[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware-trojan-netlist-scanner"
version = "2.0.0"
description = "Gate-Level Netlist Hardware Trojan & Stealth Payload Scanner"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hardware-trojan-netlist-scanner = "hardware_trojan.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/hardware-trojan-netlist-scanner"
Repository = "https://github.com/abusuraihsakhri/hardware-trojan-netlist-scanner.git"
