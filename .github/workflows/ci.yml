name: Hardware Trojan Netlist Scanner CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[api,test]"

    - name: Run Pytest Suite
      run: |
        python -m compileall -q agents hardware_trojan cli.py enrichment.py simulator.py
        python -m pip check
        python -m pytest -v

    - name: Browser rule tests
      run: |
        node --check web/app.js
        node --test web/app.test.js

    - name: Audit integrity smoke test
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test-and-audit
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check published HTML and JavaScript
        env:
          PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request

          base = os.environ["PAGE_URL"].rstrip("/") + "/"
          if not base.startswith("https://"):
              raise RuntimeError("Deployment did not return an HTTPS Pages URL")
          for attempt in range(20):
              try:
                  req = urllib.request.Request(base, headers={"User-Agent": "Pages-Smoke-Test"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      assert response.status == 200
                      html = response.read().decode("utf-8")
                  req = urllib.request.Request(base + "app.js", headers={"User-Agent": "Pages-Smoke-Test"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      assert response.status == 200
                      js = response.read().decode("utf-8")
                  assert 'id="audit-form"' in html
                  assert 'src="./app.js"' in html
                  assert 'evaluateRecord' in js
                  assert 'LOCAL_DETERMINISTIC_METRIC_TRIAGE' in js
                  print(f"Verified public HTML and evaluator assets at {base}")
                  break
              except (AssertionError, OSError, UnicodeError) as exc:
                  if attempt == 19:
                      raise RuntimeError(f"GitHub Pages HTTP smoke test failed: {exc}") from exc
                  time.sleep(5)
          PY
